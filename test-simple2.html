<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔥 TEST SIMPLE</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<body>
    <h1>🔥 TEST SIMPLE</h1>
    <button onclick="tester()">🔥 Envoyer</button>
    <div id="resultat"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLmLjdSU2b07QAPxj0yMUHS_CQ9WWSJDI",
            authDomain: "galaxie-anciens-Lby.firebaseapp.com",
            projectId: "galaxie-anciens-Lby",
            storageBucket: "galaxie-anciens-Lby.firebasestorage.app",
            messagingSenderId: "366912186594",
            appId: "1:366912186594:web:b06b5bd4296c3ddb9a196bb"
        };

        console.log("1. Démarrage");
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("2. Firebase OK");

        function tester() {
            console.log("3. Bouton");
            document.getElementById('resultat').innerHTML = "⏳ Envoi...";

            db.collection('test2').add({
                message: "Test " + Date.now()
            })
            .then(() => {
                document.getElementById('resultat').innerHTML = "✅ SUCCÈS !";
                console.log("4. OK");
            })
            .catch((err) => {
                document.getElementById('resultat').innerHTML = "❌ " + err.message;
                console.error("5. Erreur:", err);
            });
        }
    </script>
</body>
